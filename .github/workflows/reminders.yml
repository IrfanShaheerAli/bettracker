name: Betting reminders

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due reminders
        run: |
          curl --fail --silent --show-error --max-time 60 
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" 
            "${{ secrets.SITE_URL }}/api/cron/reminders"